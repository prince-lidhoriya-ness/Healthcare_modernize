services:
  db:
    image: postgres:13
    container_name: ivirma-db
    environment:
      POSTGRES_DB: ivirma_clinic
      POSTGRES_USER: ivirma_app
      # STORY-009 / ADR-003: supplied at runtime, never committed. Local runs: .env next to this file
      # (git-ignored, copy .env.example); Jenkins: the Secret text credential ivirma-db-password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env next to docker-compose.yml (copy .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivirma_app -d ivirma_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ivirma-backend
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env next to docker-compose.yml (copy .env.example)}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ivirma-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
