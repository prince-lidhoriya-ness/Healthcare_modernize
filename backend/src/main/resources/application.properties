spring.application.name=ivirma-clinic-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ivirma_clinic
spring.datasource.username=ivirma_app
spring.datasource.password=Ivirma@2024!

# Schema (STORY-003 / TASK-007): Flyway owns the schema (classpath:db/migration, V1__baseline = the legacy
# Hibernate 6.3 schema). Hibernate only validates it and fails start-up if an entity and the schema disagree.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
# Baselining a database created by the legacy build (non-empty, no flyway_schema_history): set
# FLYWAY_BASELINE_ON_MIGRATE=true for ONE start, only after the schema-diff gate passed (forge/db/strategy.md 3.3),
# then remove it. Default false: an unexpected non-empty schema makes start-up fail fast instead of being stamped V1.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=legacy hibernate 6.3 schema
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Seed synthetic demo data when the database is empty
clinic.seed-demo-data=true

# Demo logins created on first start when there are no accounts (see DemoAccountSeeder).
# Override with environment variables outside a local demo.
clinic.demo-accounts.admin-username=${DEMO_ADMIN_USERNAME:admin}
clinic.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:Admin@123}
clinic.demo-accounts.customer-password=${DEMO_CUSTOMER_PASSWORD:Patient@123}

# Error responses
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

logging.level.com.ivirma.clinic=INFO
